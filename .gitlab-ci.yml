# GitLab CI pipeline — mirrors .github/workflows/{build,sanitizers,valgrind,coverage}.yml
# Stages run in order; independent jobs within a stage execute in parallel.

stages:
  - build
  - test
  - quality

# interruptible: true cancels in-flight runs when a newer commit arrives on the
# same ref — equivalent to GitHub Actions concurrency cancel-in-progress: true.
default:
  interruptible: true

# Conan 2 home pinned inside CI_PROJECT_DIR so GitLab cache paths (which must
# be relative to CI_PROJECT_DIR) capture the full package store.
variables:
  CONAN_HOME: "$CI_PROJECT_DIR/.conan2-cache"

# ---------------------------------------------------------------------------
# build stage
# ---------------------------------------------------------------------------

# Builds the Docker image end-to-end; unit tests run inside the builder stage
# (via ctest) so a test failure causes docker build to fail here.
docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
  before_script:
    - docker version
  script:
    - docker build --progress=plain .

# GCC Release build + unit tests (mirrors build.yml gcc matrix entry).
build-gcc:
  stage: build
  image: ubuntu:24.04
  cache:
    key: "conan-gcc-release-$CI_COMMIT_REF_SLUG"
    paths:
      - .conan2-cache/
    policy: pull-push
    fallback_keys:
      - "conan-gcc-release-"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends cmake ninja-build make python3-venv
    - python3 -m venv /opt/conan-venv
    - /opt/conan-venv/bin/pip install --no-cache-dir "conan>=2,<3"
    - export PATH="/opt/conan-venv/bin:$PATH"
    - conan profile detect --force
    - cp profiles/gcc "$CONAN_HOME/profiles/default"
  script:
    - |
      conan install . --build=missing \
        --profile:host=default \
        --profile:build=default \
        -s:h build_type=Release \
        -s:b build_type=Release
    - cmake --preset release
    - cmake --build --preset release --parallel
    - ctest --test-dir build/Release -VV --progress

# Clang 16 Release build + unit tests (mirrors build.yml clang matrix entry).
build-clang:
