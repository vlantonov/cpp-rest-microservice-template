# ---------------------------------------------------------------------------
# quality stage (mirrors valgrind.yml and coverage.yml)
# Runs automatically on push to main; available as manual trigger otherwise.
# ---------------------------------------------------------------------------

valgrind:
  stage: quality
  image: ubuntu:24.04
  cache:
    key: "conan-gcc-debug-$CI_COMMIT_REF_SLUG"
    paths:
      - .conan2-cache/
    policy: pull-push
    fallback_keys:
      - "conan-gcc-debug-"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: manual
      allow_failure: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends cmake ninja-build make python3-venv valgrind
    - python3 -m venv /opt/conan-venv
    - /opt/conan-venv/bin/pip install --no-cache-dir "conan>=2,<3"
    - export PATH="/opt/conan-venv/bin:$PATH"
    - conan profile detect --force
    - cp profiles/gcc "$CONAN_HOME/profiles/default"
  script:
    - |
      conan install . --build=missing \
        --profile:host=default \
        --profile:build=default \
        -s:h build_type=Debug \
        -s:b build_type=Debug
    - cmake --preset debug
    - cmake --build --preset debug --target microservice_tests --parallel
    - |
      valgrind \
        --tool=memcheck \
        --leak-check=full \
        --show-reachable=yes \
        --num-callers=40 \
        --track-origins=yes \
        --error-exitcode=1 \
        --log-file=valgrind-memcheck.txt \
        ./build/Debug/tests/microservice_tests
  artifacts:
    when: always
    paths:
      - valgrind-memcheck.txt
    expire_in: 2 weeks

# lcov coverage gate ≥ 70 % (mirrors coverage.yml).
# GitLab parses the coverage percentage from the lcov summary via the regex below.
coverage:
  stage: quality
  image: ubuntu:24.04
  cache:
    # Shares the Debug Conan store with the valgrind job (identical build_type).
    key: "conan-gcc-debug-$CI_COMMIT_REF_SLUG"
    paths:
      - .conan2-cache/
    policy: pull-push
    fallback_keys:
      - "conan-gcc-debug-"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: manual
      allow_failure: true
  coverage: '/lines\.*: (\d+\.\d+)%/'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends cmake ninja-build make python3-venv lcov
    - python3 -m venv /opt/conan-venv
    - /opt/conan-venv/bin/pip install --no-cache-dir "conan>=2,<3"
    - export PATH="/opt/conan-venv/bin:$PATH"
    - conan profile detect --force
    - cp profiles/gcc "$CONAN_HOME/profiles/default"
  script:
    - |
      conan install . --build=missing \
        --profile:host=default \
        --profile:build=default \
        -s:h build_type=Debug \
        -s:b build_type=Debug
    - cmake --preset coverage
    - cmake --build --preset coverage --parallel
    # cov_data: zero counters → run tests → lcov capture → filter → cov.info.cleaned
    - cmake --build --preset coverage --target cov_data
    - COVERAGE=$(lcov --summary build/Coverage/cov.info.cleaned 2>&1 | grep "lines\." | grep -oE '[0-9]+\.[0-9]+' | head -1)
    - echo "Total line coverage ${COVERAGE}%"
    - python3 -c "import sys; cov=float('${COVERAGE}'); sys.exit(0 if cov>=70.0 else (print('Coverage '+str(round(cov,1))+'% is below the 70% gate',file=sys.stderr) or 1))"
  artifacts:
    paths:
      - build/Coverage/cov.info.cleaned
    expire_in: 1 week
