  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends cmake ninja-build make python3-venv clang-16 clang++-16
    - python3 -m venv /opt/conan-venv
    - /opt/conan-venv/bin/pip install --no-cache-dir "conan>=2,<3"
    - export PATH="/opt/conan-venv/bin:$PATH"
    - conan profile detect --force
