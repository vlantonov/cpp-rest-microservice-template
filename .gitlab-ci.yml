      - .conan2-cache/
    policy: pull-push
    fallback_keys:
      - "conan-clang-asan-"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: manual
      allow_failure: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends cmake ninja-build make python3-venv clang-16 clang++-16
    - python3 -m venv /opt/conan-venv
